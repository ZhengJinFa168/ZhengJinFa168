<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Jin Fa Zheng: ML, robotics and embedded systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="220" rx="16"/></clipPath>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#30363d"/>
    </pattern>
  </defs>
  <style>
    .name  { font: 700 46px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .pre   { font: 500 20px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #8b949e; }
    .rot   { font: 500 20px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: url(#accent);
             opacity: 0; animation: cycle 12s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(12px); }
      4%   { opacity: 1; transform: translateY(0); }
      22%  { opacity: 1; transform: translateY(0); }
      26%  { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 0; transform: translateY(-12px); }
    }
    .wave  { fill: none; stroke: url(#accent); stroke-width: 2.5; stroke-linecap: round;
             stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 6s ease-in-out infinite; }
    .wave2 { stroke-width: 1.5; opacity: .45; animation-delay: .6s; }
    @keyframes draw {
      0%   { stroke-dashoffset: 1400; }
      45%  { stroke-dashoffset: 0; }
      70%  { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -1400; opacity: .2; }
    }
    .dot   { fill: #3fb950; animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) {
      .rot, .wave, .dot { animation: none; }
      .r1 { opacity: 1; } .wave { stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <rect width="900" height="220" fill="url(#grid)"/>

    <!-- signal waves along the bottom -->
    <path class="wave" d="M0 192 C 75 168, 150 168, 225 192 S 375 216, 450 192 S 600 168, 675 192 S 825 216, 900 192"/>
    <path class="wave wave2" d="M0 182 C 90 208, 180 208, 270 182 S 450 165, 540 182 S 720 208, 900 175"/>

    <!-- status dot -->
    <circle class="dot" cx="58" cy="52" r="6"/>
    <text x="74" y="58" class="pre" style="font-size:15px">Computer Engineering · Politecnico di Milano</text>

    <text x="50" y="110" class="name">Jin Fa Zheng</text>

    <text x="50" y="148" class="pre">&gt;</text>
    <g transform="translate(74 0)">
      <text y="148" class="rot r1">training models on messy real-world data</text>
      <text y="148" class="rot r2">teaching robots where they are</text>
      <text y="148" class="rot r3">writing firmware close to the metal</text>
      <text y="148" class="rot r4">winning hackathons with evidence, not guesses</text>
    </g>
  </g>
</svg>
